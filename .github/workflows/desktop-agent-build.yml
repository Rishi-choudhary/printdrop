name: Desktop Agent (Windows)

# Builds the Windows installer for the shopkeeper desktop agent.
#   - Manual run (Actions → "Run workflow"): download the .exe from the run's Artifacts.
#   - Push a tag like v1.0.1: builds + attaches the .exe to a GitHub Release
#     (this is also what electron-updater auto-updates from).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build installer
        run: npx electron-builder --win --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: printdrop-agent-windows
          path: |
            desktop-agent/dist/*.exe
          if-no-files-found: error
